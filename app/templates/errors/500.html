{% extends "base.html" %}

{% block title %}Server Error — CleanHome PH{% endblock %}

{% block content %}
<div class="container" style="padding:80px 20px;text-align:center;">
    <div style="font-size:4rem;margin-bottom:16px;">⚠️</div>
    <h1 style="font-size:2.5rem;margin-bottom:12px;color:var(--text-dark);">Something Went Wrong (500)</h1>
    <p style="color:var(--text-muted);max-width:480px;margin:0 auto 28px;font-size:1.05rem;">
        An unexpected error occurred on our server. Our team has been notified. Please try again shortly.
    </p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <a href="{{ url_for('public.index') }}" class="btn btn-primary btn-lg">Back to Homepage</a>
        <a href="{{ url_for('public.contact') }}" class="btn btn-secondary btn-lg">Contact Support</a>
    </div>
</div>
{% endblock %}
