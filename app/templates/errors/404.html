{% extends "base.html" %}

{% block title %}Page Not Found — CleanHome PH{% endblock %}

{% block content %}
<div class="container" style="padding:80px 20px;text-align:center;">
    <div style="font-size:4rem;margin-bottom:16px;">🔍</div>
    <h1 style="font-size:2.5rem;margin-bottom:12px;color:var(--text-dark);">Page Not Found (404)</h1>
    <p style="color:var(--text-muted);max-width:480px;margin:0 auto 28px;font-size:1.05rem;">
        The page you are looking for doesn't exist, has been removed, or is temporarily unavailable.
    </p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <a href="{{ url_for('public.index') }}" class="btn btn-primary btn-lg">Back to Homepage</a>
        <a href="{{ url_for('public.services') }}" class="btn btn-secondary btn-lg">Browse Services</a>
    </div>
</div>
{% endblock %}
